name: Dashboard checks

on:
  push:
    branches: [main, refactor/optimitzacio]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate dashboard
        run: |
          node scripts/check-dashboard.js
          node scripts/test-dashboard.js
